<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Exercício 2 - Operadores Aritméticos</title>
</head>
<body>
  <h1>Exercício 2 - Operadores Aritméticos</h1>
  <button onclick="calcular()">Calcular</button>

  <script>
    function calcular() {
      const num1 = Number(prompt("Digite o primeiro número:"));
      const num2 = Number(prompt("Digite o segundo número:"));

      console.log(`Números informados: ${num1} e ${num2}`);
      console.log(`Soma: ${num1 + num2}`);
      console.log(`Subtração: ${num1 - num2}`);
      console.log(`Multiplicação: ${num1 * num2}`);
      console.log(`Divisão: ${num1 / num2}`);
      console.log(`Resto da divisão: ${num1 % num2}`);

      alert(
        `Resultados:\n` +
        `Soma: ${num1 + num2}\n` +
        `Subtração: ${num1 - num2}\n` +
        `Multiplicação: ${num1 * num2}\n` +
        `Divisão: ${num1 / num2}\n` +
        `Resto da divisão: ${num1 % num2}`
      );
    }
  </script>
</body>
</html>
