<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Exercício 4 - Laços de Repetição</title>
</head>
<body>
  <h1>Exercício 4 - Laços de Repetição</h1>
  <button onclick="imprimirNumeros()">Imprimir números de 1 a 100</button>

  <script>
    function imprimirNumeros() {
      for (let i = 1; i <= 100; i++) {
        console.log(i);
      }
      alert("Números de 1 a 100 foram impressos no console.");
    }
  </script>
</body>
</html>
