<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Fetch API - Usuários</title>
</head>
<body>
  <h1>Usuários da API JSONPlaceholder</h1>
  <button onclick="buscarUsuarios()">Buscar Usuários</button>
  <ul id="listaUsuarios"></ul>

  <script>
    function buscarUsuarios() {
      fetch('https://jsonplaceholder.typicode.com/users')
        .then(response => response.json())
        .then(usuarios => {
          const lista = document.getElementById('listaUsuarios');
          lista.innerHTML = ''; // Limpa a lista antes de mostrar

          usuarios.forEach(usuario => {
            console.log(usuario.name); // Imprime no console

            const li = document.createElement('li');
            li.textContent = usuario.name; // Nome do usuário
            lista.appendChild(li); // Adiciona na lista da página
          });
        })
        .catch(error => {
          console.error('Erro ao buscar usuários:', error);
          alert('Erro ao buscar usuários.');
        });
    }
  </script>
</body>
</html>
